<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data:; script-src 'self'; connect-src 'self' http://localhost:8080;">
    <title>Login Register form</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <span class="rotate-bg"></span>
        <span class="rotate-bg2"></span>

        <div class="form-box login">
            <h2 class="title animation" style="--i:0; --j:21">Login</h2>
            <form id="loginForm" novalidate>

                <div class="input-box animation" style="--i:1; --j:22">
                    <input type="text" id="loginUsername" required minlength="3" maxlength="100">
                    <label for="loginUsername">Username or Email</label>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box animation" style="--i:2; --j:23">
                    <input type="password" id="loginPassword" required minlength="8" maxlength="100">
                    <label for="loginPassword">Password</label>
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <button type="submit" class="btn animation" style="--i:3; --j:24">Login</button>
                <div id="loginError" class="error-message" style="color: red; margin-top: 10px; display: none;"></div>
                <div class="linkTxt animation" style="--i:5; --j:25">
                    <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
                </div>
            </form>
        </div>

        <div class="info-text login">
            <h2 class="animation" style="--i:0; --j:20">Welcome Back!</h2>
            <p class="animation" style="--i:1; --j:21">To AI Powered Mock Interview system</p>
        </div>




        <div class="form-box register">

            <h2 class="title animation" style="--i:17; --j:0">Sign Up</h2>

            <form id="registerForm" novalidate>

                <div class="input-box animation" style="--i:18; --j:1">
                    <input type="text" id="regUsername" required minlength="3" maxlength="50">
                    <label for="regUsername">Username</label>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box animation" style="--i:19; --j:2">
                    <input type="email" id="regEmail" required>
                    <label for="regEmail">Email</label>
                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="input-box animation" style="--i:20; --j:3">
                    <input type="password" id="regPassword" required minlength="8" maxlength="100">
                    <label for="regPassword">Password</label>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <button type="submit" class="btn animation" style="--i:21;--j:4">Sign Up</button>
                <div id="registerError" class="error-message" style="color: red; margin-top: 10px; display: none;"></div>
                <div id="registerSuccess" class="success-message" style="color: green; margin-top: 10px; display: none;"></div>

                <div class="linkTxt animation" style="--i:22; --j:5">
                    <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                </div>

            </form>
        </div>

        <div class="info-text register">
            <h2 class="animation" style="--i:17; --j:0;">Welcome! </h2>
            <p class="animation" style="--i:18; --j:1;">To AI Powered Mock Interview system
            </p>
        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
